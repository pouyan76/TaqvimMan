
name: Create TaqvimYar Plus Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Check password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Password must be at least 6 characters"
            exit 1
          fi

          echo "Password check passed"

      - name: Generate Android signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore taqvimyar-plus.jks \
            -alias taqvimyar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=TaqvimYar Plus, OU=Android, O=TaqvimYar, L=Unknown, ST=Unknown, C=IR"

      - name: Verify generated key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore taqvimyar-plus.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias taqvimyar

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: taqvimyar-plus-keystore
          path: taqvimyar-plus.jks
          retention-days: 1
